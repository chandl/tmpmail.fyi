{{define "head"}}<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>(()=>{const r=document.documentElement;r.classList.add("js");try{const t=localStorage.getItem("tmpmail:theme");if(t==="light"||t==="dark")r.dataset.theme=t}catch(_){}})()</script>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<style>{{.CSS}}</style>
<script defer src="/ui.js?v={{.AssetVersion}}"></script>{{end}}

{{define "header"}}<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header"><div class="wrap">
<a class="wordmark" href="/">tmpmail</a>
<span class="tagline">Disposable email · deleted after 1 hour</span>
<nav class="header-nav" aria-label="Site">
<a href="/privacy">Privacy</a>
<button class="icon-btn theme-toggle" type="button" data-theme-toggle aria-label="Switch theme" title="Switch theme">
<svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
<svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
</button>
</nav>
</div></header>{{end}}

{{define "footer"}}<footer class="site-footer"><div class="wrap">
<nav aria-label="Resources"><a href="/openapi.json">API</a><a href="https://github.com/chandl/tmpmail.fyi" target="_blank" rel="noopener noreferrer">GitHub</a></nav>
<span class="shortcuts">Shortcuts: <kbd>↑</kbd> <kbd>↓</kbd> move between messages · <kbd>R</kbd> refresh</span>
<span class="copyright">© {{.Year}} <a href="https://chandl.io/" target="_blank" rel="noopener noreferrer">chandl.io</a></span>
</div></footer>
<div id="status" class="visually-hidden" role="status" aria-live="polite"></div>{{end}}

{{define "copy-label"}}<span class="swap"><span class="swap-idle">{{.}}</span><span class="swap-done" aria-hidden="true">Copied ✓</span></span>{{end}}
