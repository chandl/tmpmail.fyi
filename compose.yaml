services:
  tmpmail:
    image: ghcr.io/chandl/tmpmail.fyi:latest
    build: .
    environment:
      MAIL_DOMAIN: mail.example.com # Change to your mail domain.
      DATA_DIR: /data
      SMTP_ADDR: :2525
      HTTP_ADDR: :8080
      MESSAGE_TTL: 1h
      MAX_MESSAGE_BYTES: 2097152
      MAX_STORAGE_BYTES: 21474836480
    ports:
      - "25:2525"
      - "8080:8080"
    volumes:
      - tmpmail-data:/data
    restart: unless-stopped

volumes:
  tmpmail-data:
