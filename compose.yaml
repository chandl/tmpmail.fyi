services:
  tmpmail:
    image: ghcr.io/chandl/tmpmail.fyi:latest
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "25:2525"
      - "8080:8080"
    volumes:
      - tmpmail-data:/data
      - smtp-certs:/certs:ro
    restart: unless-stopped

volumes:
  tmpmail-data:
  smtp-certs:
