services:
  tmpmail:
    image: ghcr.io/chandl/tmpmail.fyi:latest
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "25:2525"
      - "8080:8080"
      # Optional admin: enable ADMIN_ENABLED and set ADMIN_ADDR=:8081 in .env.
      # Publish only on host loopback; access via SSH tunnel on remote hosts.
      # - "127.0.0.1:8081:8081"
    volumes:
      - tmpmail-data:/data
      - smtp-certs:/certs:ro
    restart: unless-stopped

volumes:
  tmpmail-data:
  smtp-certs:
