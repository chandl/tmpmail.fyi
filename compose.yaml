services:
  traefik:
    image: traefik:v3.3
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-data:/letsencrypt
    restart: unless-stopped

  tmpmail:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      SMTP_ADDR: :2525
      HTTP_ADDR: :8080
      MESSAGE_TTL: 1h
    ports:
      - "25:2525"
    volumes:
      - tmpmail-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.tmpmail.rule=Host(`${MAIL_DOMAIN}`)
      - traefik.http.routers.tmpmail.entrypoints=websecure
      - traefik.http.routers.tmpmail.tls.certresolver=letsencrypt
      - traefik.http.services.tmpmail.loadbalancer.server.port=8080
    restart: unless-stopped

volumes:
  tmpmail-data:
  traefik-data:
