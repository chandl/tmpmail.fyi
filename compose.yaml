services:
  tmpmail:
    image: ghcr.io/chandl/tmpmail.fyi:latest
    build: .
    environment:
      MAIL_DOMAIN: mail.example.com # Change to your mail domain.
      DATA_DIR: /data
      SMTP_ADDR: :2525
      HTTP_ADDR: :8080
      # Metrics are not published to the host. Keep this private to the Compose network.
      METRICS_ADDR: :9090
      MESSAGE_TTL: 1h
      MAX_MESSAGE_BYTES: 2097152
      MAX_STORAGE_BYTES: 21474836480
      # A global admission cap; there is intentionally no source-IP limit because
      # SMTP deployments often receive a trusted proxy's address instead.
      SMTP_MAX_CONNECTIONS: 100
      # Return fast 503 responses rather than exhausting the process under HTTP load.
      HTTP_MAX_CONCURRENT_REQUESTS: 512
      METRICS_ENABLED: "false"
      # Use Prometheus for successful request volume; log all, errors, or off.
      HTTP_ACCESS_LOG_MODE: errors
      # Comma-separated request headers to include in HTTP logs.
      HTTP_LOG_HEADERS: User-Agent
    ports:
      - "25:2525"
      - "8080:8080"
    volumes:
      - tmpmail-data:/data
    restart: unless-stopped

volumes:
  tmpmail-data:
